<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Item Price Check</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
    <h1>Item Price Check</h1>

    <label for="search-input">Search by name, SKU, or barcode</label>
    <input id="search-input" type="text" autocomplete="off" placeholder="e.g. Widget, SKU-1001, or a barcode">

    <div id="status" role="status" aria-live="polite"></div>
    <ul id="results" aria-label="Search results"></ul>
</main>
<script src="app.js"></script>
</body>
</html>
